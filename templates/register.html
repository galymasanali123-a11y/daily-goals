{% extends "base.html" %}
{% block subtitle %}Create an account{% endblock %}
{% block content %}
<div class="card login-card">
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <h2>Create your account</h2>
  <p class="auth-lede">One account keeps your goals in sync across devices.</p>
  <form method="post" class="auth-form" action="{{ url_for('register') }}">
    <input type="text" name="username" placeholder="Username" autocapitalize="none" autocomplete="username" spellcheck="false" autofocus required>
    <input type="email" name="email" placeholder="Email address" autocapitalize="none" autocomplete="email" spellcheck="false" required>
    <div class="password-field">
      <input type="password" name="password" placeholder="Password (min 4 characters)" autocomplete="new-password" required>
      <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
        <svg class="icon-show" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="icon-hide" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
    <div class="password-field">
      <input type="password" name="confirm" placeholder="Confirm password" autocomplete="new-password" required>
      <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
        <svg class="icon-show" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="icon-hide" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
    <button type="submit" class="primary">Create account</button>
  </form>
  <a class="muted-link" href="{{ url_for('login') }}">Already have an account? Sign in</a>
</div>
{% endblock %}
