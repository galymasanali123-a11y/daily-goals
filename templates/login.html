{% extends "base.html" %}
{% block subtitle %}Sign in{% endblock %}
{% block content %}
<div class="card login-card">
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <h2>Sign in</h2>
  <form method="post" action="{{ url_for('login') }}" style="display:flex; flex-direction:column; gap:10px;">
    <input type="text" name="username" placeholder="Username" autocapitalize="none" autofocus required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit" class="primary">Sign in</button>
  </form>
  <a class="muted-link" href="{{ url_for('register') }}">Create an account</a>
</div>
{% endblock %}
